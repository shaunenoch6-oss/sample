<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - FARMLINK+</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<header>

    <div class="logo">
        <img src="FARMLINK+.png" alt="FARMLINK+ Logo">
        <span>FARMLINK+</span>
    </div>

</header>

<section class="checkout">

    <h1>Checkout</h1>

    <form id="checkoutForm">

       <input
    type="text"
    id="fullname"
    placeholder="Full Name"
    required
>

<input
    type="tel"
    id="phone"
    placeholder="09XXXXXXXXX"
    pattern="[0-9]{11}"
    maxlength="11"
    required
>

<textarea
    id="address"
    placeholder="Delivery Address"
    required
></textarea>

        <select id="payment" required>
    <option value="">Select payment method</option>
    <option value="cod">Cash on Delivery</option>
    <option value="gcash">GCash</option>
    <option value="paymaya">Paymaya</option>
</select>

        <div id="gcashInfo" style="display:none; margin-top:15px;">

    <h3>GCash Payment</h3>

    <p><strong>GCash Number:</strong> 09XX-XXX-XXXX</p>
    <p><strong>Account Name:</strong> FARMLINK+</p>

    <label>Reference Number</label>
    <input
        type="text"
        id="gcashRef"
        placeholder="Enter GCash Reference Number"
    >
    
</div>

<div id="paymayaInfo" style="display:none; margin-top:15px;">
    <h3>Maya Payment</h3>
    <p><strong>Maya Number:</strong> 09XX-XXX-XXXX</p>
    <p><strong>Account Name:</strong> FARMLINK+</p>

    <label>Maya Reference Number</label>
    <input
        type="text"
        id="paymayaRef"
        placeholder="Enter paymaya Reference Number"
    >
</div>


        <select required>
            <option>type of delivery</option>
            <option>Pick up at Store</option>
            <option>Delivery</option>
            <option>Drop & go</option>
        </select>

        <button type="submit">
            Place Order
        </button>

    </form>

</section>

<script src="checkout.js"></script>

<div id="successPopup" class="popup">
    <div class="popup-content">
        <i class="fa-solid fa-circle-check"></i>
        <h2>Order Placed!</h2>
        <p>Thank you for shopping with FARMLINK+.</p>
        <button id="continueBtn">Continue Shopping</button>
    </div>
</div>

</body>
</html>
